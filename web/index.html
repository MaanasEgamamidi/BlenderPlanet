<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Galaxy</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels"></div>

    <div id="ui">
      <header class="top-left">
        <div class="eyebrow">Course Galaxy</div>
        <h1 id="galaxy-name">—</h1>
        <div class="surface-toggle" role="radiogroup" aria-label="Planet surface">
          <button role="radio" data-surface="hex" aria-checked="true" title="Hex field (T)">
            <svg viewBox="0 0 24 24"><path d="M12 2.5 20.2 7.25v9.5L12 21.5l-8.2-4.75v-9.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 8.2 15.3 10.1v3.8L12 15.8l-3.3-1.9v-3.8z" fill="currentColor"/></svg>
            <span>Hex field</span>
          </button>
          <button role="radio" data-surface="smooth" aria-checked="false" title="Smooth planet (T)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 10c3 1.5 5-1 8 0s4 2.5 6 1.5M6.5 16c2.5-.5 4 1 6.5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>Smooth</span>
          </button>
        </div>
      </header>

      <div class="top-right">
        <button class="btn" id="galaxy-toggle" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 3c5 0 9 2.7 9 6s-4 5-9 5-6 1.3-6 3 2.7 4 6 4M12 3c-3.3 0-6 2-6 4.5S8.7 12 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Galaxies</span>
        </button>
        <div class="dropdown" id="galaxy-menu" hidden></div>
      </div>

      <nav class="planet-panel" aria-label="Planets">
        <div class="panel-title">Planets</div>
        <ul id="planet-list"></ul>
      </nav>

      <section class="info" id="info">
        <div class="info-tools">
          <button class="icon-btn" id="edit-planet" title="Edit planet">
            <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
          <div class="info-text">
            <div class="info-name" id="info-name">—</div>
            <div class="info-course" id="info-course">—</div>
          </div>
          <button class="icon-btn" id="delete-planet" title="Remove planet">
            <svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="progress">
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
          <div class="progress-label" id="progress-label">—</div>
        </div>
        <button class="btn primary" id="launch">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 2c3 3 4.5 6.5 4.5 10.5L14 17h-4l-2.5-4.5C7.5 8.5 9 5 12 2zM10 17l-2 4 4-2 4 2-2-4M12 9.5a1.5 1.5 0 1 0 0 .01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>Launch</span>
        </button>
      </section>

      <button class="btn corner bottom-left" id="back">
        <svg viewBox="0 0 24 24" class="ico"><path d="M20 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Back</span>
      </button>
      <button class="btn corner bottom-right" id="new-planet">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v6M9 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>New Planet</span>
      </button>

      <div class="hint" id="hint">Drag to orbit · Scroll to zoom · ← → to switch planets · T to toggle surface</div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <div id="warp"></div>

    <div id="loading">
      <div class="loading-inner">
        <div class="eyebrow">Course Galaxy</div>
        <div class="loading-title">Charting the stars</div>
        <div class="loading-bar"><div id="loading-fill"></div></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
